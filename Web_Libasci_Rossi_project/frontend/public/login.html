<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - Stasera</title>
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/login.css">
    <script src="/js/navbar.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar"></div>
    <script>
        fetch("/components/navbar.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("navbar").innerHTML = html;
                initNavbar();
            });
    </script>

    <!-- LOGIN CONTENT -->
    <div class="login-wrapper">
        <div class="login-box">
            <h2>Accedi a Stasera</h2>
            <p class="subtitle">Usa il tuo account Google per entrare</p>

            <div id="g_id_onload" 
                 data-client_id="936482076196-fqtjkdmeuscsvon9f4dg0klb6fos3qgp.apps.googleusercontent.com" 
                 data-callback="handleCredentialResponse" 
                 data-auto_prompt="false">
            </div>
            
            <div class="g_id_signin" 
                 data-type="standard" 
                 data-size="large" 
                 data-text="signin_with" 
                 data-shape="rectangular">
            </div>

            <p id="login-message"></p>

            <p class="login-footer-text">
                Non hai ancora un account? <a href="/signup">Registrati qui</a>
            </p>
        </div>
    </div>

    <!-- FOOTER -->
    <div id="footer"></div>
    <script>
        fetch("/components/footer.html")
            .then(res => res.text())
            .then(html => document.getElementById("footer").innerHTML = html);
    </script>

    <script src="/js/login.js"></script>
</body>

</html>
